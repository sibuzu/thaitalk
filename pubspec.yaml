name: thaitalk
description: ThaiTalk — 每天一點泰語，自信開口說。
publish_to: none
version: 1.1.0+2
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.12.0
  http: ^1.6.0
  crypto: ^3.0.7
  path_provider: ^2.1.6
  audioplayers: ^6.8.1
  record: ^6.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/thai_practice_dataset_400.json
    - assets/brand/
  fonts:
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC.ttf
    - family: NotoSerifThai
      fonts:
        - asset: assets/fonts/NotoSerifThai.ttf
