name: thaitalk
description: ThaiTalk — 泰語、日語、韓語與越南語學習。
publish_to: none
version: 1.1.0+2
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.12.0
  http: ^1.6.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  crypto: ^3.0.7
  path_provider: ^2.1.6
  record: ^6.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/thai_practice_dataset.json
    - assets/data/japanese_practice_dataset.json
    - assets/data/korean_practice_dataset.json
    - assets/data/vietnamese_practice_dataset.json
    - assets/brand/app-icon.png
    - assets/fonts/OFL-NotoSansTC.txt
    - assets/fonts/OFL-NotoSerifThai.txt
    - assets/fonts/OFL-NotoSansKR.txt
  fonts:
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC.subset.ttf
    - family: NotoSerifThai
      fonts:
        - asset: assets/fonts/NotoSerifThai.ttf
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR.subset.ttf
